
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock Pro | Enterprise Inventory Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
          font-family: 'Inter', sans-serif; 
          background-color: #f8fafc; 
          overflow-x: hidden;
        }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animation */
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
          animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes bounceSlow {
          0%, 100% { transform: translateY(-5%); }
          50% { transform: translateY(0); }
        }
        .animate-bounce-slow {
          animation: bounceSlow 3s infinite ease-in-out;
        }

        /* Print styles for official business reports */
        @media print {
          .no-print { display: none !important; }
          body { background: white !important; padding: 0 !important; }
          main { margin-left: 0 !important; padding: 0 !important; }
          .print-only { display: block !important; }
          .shadow-sm, .shadow-2xl { shadow: none !important; border: 1px solid #e2e8f0 !important; }
          table { width: 100% !important; border-collapse: collapse !important; }
          th, td { border: 1px solid #cbd5e1 !important; padding: 8px !important; font-size: 10pt !important; }
          th { background-color: #f1f5f9 !important; color: black !important; }
          .bg-slate-50 { background-color: #f8fafc !important; }
          .text-rose-500 { color: #be123c !important; font-weight: bold !important; }
          @page { margin: 1.5cm; }
        }
    </style>
