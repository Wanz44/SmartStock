
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock Pro | Logistics Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
    <style>
        body { 
          font-family: 'Plus Jakarta Sans', sans-serif; 
          background-color: #f8fafc; 
          color: #1a202c;
          overflow-x: hidden;
          background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
          background-size: 20px 20px;
        }

        .font-header {
            font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .sidebar-float {
          position: fixed;
          top: 20px;
          left: 20px;
          bottom: 20px;
          width: 260px;
          background-color: #1a3a22;
          border-radius: 30px;
          z-index: 50;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
          display: flex;
          flex-direction: column;
          padding: 40px 20px;
        }

        /* MODÈLES D'IMPRESSION EXCEL */
        .excel-print-mode { display: none; }

        @media print {
          .no-print { display: none !important; }
          .excel-print-mode { 
            display: block !important; 
            background: white !important;
            padding: 20px !important;
          }
          
          body { background: white !important; }
          main { margin-left: 0 !important; padding: 0 !important; }
          
          /* Modèle Excel Green */
          .model-excel-green .excel-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
          }
          .model-excel-green th {
            background-color: #1a3a22 !important;
            color: white !important;
            padding: 12px;
            border: 1px solid #064e3b;
            text-transform: uppercase;
            -webkit-print-color-adjust: exact;
          }
          .model-excel-green td {
            border: 1px solid #d1fae5;
            padding: 8px 12px;
          }
          .model-excel-green tr:nth-child(even) {
            background-color: #f0fdf4 !important;
            -webkit-print-color-adjust: exact;
          }

          /* Modèle Modern Dark */
          .model-modern-dark th {
            background-color: #0f172a !important;
            color: white !important;
            padding: 12px;
            border-bottom: 2px solid #1e293b;
            -webkit-print-color-adjust: exact;
          }
          .model-modern-dark td {
            border-bottom: 1px solid #f1f5f9;
            padding: 10px;
          }

          /* Numérotation des pages */
          .show-page-numbers::after {
            content: "Page " counter(page);
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 8px;
            font-weight: bold;
            color: #94a3b8;
          }
        }

        .nav-item-active {
            background-color: white !important;
            color: #1a3a22 !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-in { animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
<script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.4/client",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "react/jsx-runtime": "https://esm.sh/react@^19.2.4/jsx-runtime",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.95.3"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
